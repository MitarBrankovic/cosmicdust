# The server with what it needs, on one machine: Elasticsearch to index into
# and Kibana to search. Elasticsearch runs as a single node without security:
# for development and demonstration only.
#
#   docker compose -f deploy/server/docker-compose.yml up -d --build
#
# Nodes then send to grpc://<host>:50051; Kibana is on http://localhost:5601.
#
# NATS is optional. With it, nodes can also send to nats://<host>:4222:
#
#   NATS_ADDRESS=nats:4222 docker compose -f deploy/server/docker-compose.yml --profile nats up -d --build

services:
  elasticsearch:
    image: elasticsearch:9.5.5
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      retries: 30

  kibana:
    image: kibana:9.5.5
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  nats:
    image: nats:2.10.17
    profiles: ["nats"]
    ports:
      - "4222:4222"

  cosmicdust-server:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    environment:
      - ES_ADDRESS=http://elasticsearch:9200
      - ES_REPLICAS=0
      - NATS_ADDRESS=${NATS_ADDRESS:-}
      - RETENTION_FILE=/etc/cosmicdust-server/retention.yaml
    volumes:
      - server-data:/data
      - ./retention.example.yaml:/etc/cosmicdust-server/retention.yaml:ro
    ports:
      - "50051:50051"
      - "8080:8080"
    depends_on:
      - elasticsearch

volumes:
  es-data:
  server-data:
